<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kanban Lite – a responsive interactive task board built with vanilla HTML, CSS and JavaScript.">
  <title>Kanban Lite | Interactive Task Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Header: title, task counter, theme toggle ===== -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▦</span>
      <div>
        <h1>Kanban Lite</h1>
        <p class="tagline">Plan it. Move it. Finish it.</p>
      </div>
    </div>

    <div class="header-tools">
      <p class="counter" aria-live="polite">
        <span class="counter-item"><strong id="activeCount">0</strong> active</span>
        <span class="counter-item"><strong id="doneCount">0</strong> completed</span>
      </p>
      <button id="themeToggle" class="btn btn-ghost" type="button" aria-label="Switch between light and dark theme">
        <span id="themeIcon" aria-hidden="true">🌙</span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <main class="layout">

    <!-- ===== Add task form ===== -->
    <section class="panel form-panel" aria-labelledby="formTitle">
      <h2 id="formTitle">New task</h2>
      <form id="taskForm" novalidate>
        <div class="field">
          <label for="titleInput">Title <span class="req">*</span></label>
          <input id="titleInput" type="text" maxlength="80" placeholder="e.g. Fix login page bug" required>
          <p class="error" id="titleError" role="alert" hidden>Please enter a title.</p>
        </div>

        <div class="field">
          <label for="descInput">Description</label>
          <textarea id="descInput" rows="3" maxlength="300" placeholder="What needs to be done?"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="categoryInput">Category</label>
            <input id="categoryInput" type="text" list="categoryList" maxlength="30" placeholder="Development">
            <datalist id="categoryList"></datalist>
          </div>

          <div class="field">
            <label for="priorityInput">Priority</label>
            <select id="priorityInput">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary" type="submit">+ Add task</button>
      </form>
    </section>

    <!-- ===== Search + filter + board ===== -->
    <section class="board-area" aria-label="Task board">

      <div class="toolbar">
        <div class="field grow">
          <label for="searchInput" class="visually-hidden">Search tasks by title</label>
          <input id="searchInput" type="search" placeholder="🔍  Search by title…">
        </div>
        <div class="field">
          <label for="categoryFilter" class="visually-hidden">Filter by category</label>
          <select id="categoryFilter">
            <option value="all">All categories</option>
          </select>
        </div>
      </div>

      <div class="board" id="board">

        <section class="column" data-status="todo" aria-labelledby="todoTitle">
          <header class="column-head">
            <h2 id="todoTitle"><span class="dot dot-todo"></span>To Do</h2>
            <span class="column-count" id="count-todo">0</span>
          </header>
          <div class="task-list" id="list-todo"></div>
        </section>

        <section class="column" data-status="inprogress" aria-labelledby="progressTitle">
          <header class="column-head">
            <h2 id="progressTitle"><span class="dot dot-progress"></span>In Progress</h2>
            <span class="column-count" id="count-inprogress">0</span>
          </header>
          <div class="task-list" id="list-inprogress"></div>
        </section>

        <section class="column" data-status="completed" aria-labelledby="doneTitle">
          <header class="column-head">
            <h2 id="doneTitle"><span class="dot dot-done"></span>Completed</h2>
            <span class="column-count" id="count-completed">0</span>
          </header>
          <div class="task-list" id="list-completed"></div>
        </section>

      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Tasks are saved in your browser (localStorage). Drag cards between columns or use the arrow buttons.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
